services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: virtual_nation
      POSTGRES_USER: virtual_nation
      POSTGRES_PASSWORD: virtual_nation_dev
    ports:
      - "5432:5432"
    volumes:
      - virtual_nation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtual_nation -d virtual_nation"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: base
    command: pnpm dev --hostname 0.0.0.0
    environment:
      DATABASE_URL: postgresql://virtual_nation:virtual_nation_dev@postgres:5432/virtual_nation
      BETTER_AUTH_SECRET: local-development-secret-change-before-production
      APP_BASE_URL: http://localhost:3000
      APP_DEFAULT_LOCALE: ko
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: base
    command: pnpm worker
    environment:
      DATABASE_URL: postgresql://virtual_nation:virtual_nation_dev@postgres:5432/virtual_nation
      BETTER_AUTH_SECRET: local-development-secret-change-before-production
      APP_BASE_URL: http://localhost:3000
      APP_DEFAULT_LOCALE: ko
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  virtual_nation_pgdata:
  web_node_modules:
  worker_node_modules:
